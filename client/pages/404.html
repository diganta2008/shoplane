<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — ShopLane</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/svg+xml" href="../images/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body data-page="404">

<header class="site-header" id="site-header"></header>

<div class="container" style="padding:80px 20px;text-align:center;" data-testid="not-found">
  <div style="font-size:9rem;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">404</div>
  <h1>Page not found</h1>
  <p style="color:var(--muted);max-width:520px;margin:0 auto 24px;">
    The page you're looking for might have been moved, renamed, or never
    existed in the first place. Try heading back home.
  </p>
  <a href="home.html" class="btn btn-primary btn-lg" data-testid="go-home">← Back to home</a>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/chatbot.js" defer></script>

</body>
</html>
