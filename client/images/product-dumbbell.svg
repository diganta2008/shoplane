<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="g_dumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="g_iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow_dumb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#g_dumb)"/>
  <circle cx="510" cy="90"  r="108" fill="rgba(255,255,255,0.10)"/>
  <circle cx="72"  cy="540" r="72"  fill="rgba(0,0,0,0.08)"/>
  <g filter="url(#shadow_dumb)" transform="translate(0,120)">
    <rect x="80"  y="150" width="60"  height="140" rx="14" fill="url(#g_iron)" stroke="#0f172a" stroke-width="4"/>
    <rect x="150" y="180" width="30"  height="80"  rx="10" fill="url(#g_iron)" stroke="#0f172a" stroke-width="4"/>
    <rect x="180" y="205" width="240" height="30"  rx="14" fill="url(#g_iron)" stroke="#0f172a" stroke-width="4"/>
    <rect x="420" y="180" width="30"  height="80"  rx="10" fill="url(#g_iron)" stroke="#0f172a" stroke-width="4"/>
    <rect x="460" y="150" width="60"  height="140" rx="14" fill="url(#g_iron)" stroke="#0f172a" stroke-width="4"/>
    <line x1="200" y1="220" x2="400" y2="220" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  </g>
  <text x="300" y="524" font-family="Inter, sans-serif" font-size="27" font-weight="700"
        fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="4">IRON CORE</text>
