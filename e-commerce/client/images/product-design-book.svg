    <text x="310" y="410" font-family="Inter, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Handbook 2026</text></g>
  <text x="300" y="574" font-family="Inter, sans-serif" font-size="27" font-weight="700" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="4">AWARD WINNER</text>
