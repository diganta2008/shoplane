spring:
  application:
    name: shoplane-backend

  datasource:
    url:  ${DB_URL:jdbc:mysql://127.0.0.1:3306/shoplane?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USER:shoplane}
    password: ${DB_PASSWORD:shoplane_change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ShopLaneHikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # The schema is created by docker/init/*.sql — never let JPA modify it.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  main:
    banner-mode: off

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

# Custom application properties, bound via ShopLaneProperties
shoplane:
  jwt:
    issuer: shoplane-api
    access-secret:  ${JWT_SECRET:dev-only-shoplane-access-secret-please-change-me-min-32-chars}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-shoplane-refresh-secret-please-change-me-min-32-chars}
    access-ttl-minutes:  ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days:    ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:9090,http://127.0.0.1:9090,http://localhost:3000,http://shoplane.com,http://shoplane.com:9090,http://shoplane.com:8080,http://api.shoplane.com,http://api.shoplane.com:8080,https://diganta2008.github.io}
  openai:
    api-key:  ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model:    ${OPENAI_MODEL:gpt-4o-mini}
    temperature: ${OPENAI_TEMPERATURE:0.4}
    max-tokens:  ${OPENAI_MAX_TOKENS:400}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
    system-prompt: >
      You are ShopLane Assistant, a friendly and concise customer support agent
      for ShopLane — an online store selling electronics, fashion, home goods,
      and books.

      You can help customers:
      - Understand product features and pick between options
      - Answer questions about shipping (free over $100, 2-3 day delivery)
      - Explain the return policy (30-day free returns)
      - Point users to their cart, orders, wishlist, or account settings
        (they'll find these in the account menu; do NOT fabricate specific
        order or user data)

      Rules:
      - Keep replies short (2-4 sentences). Use bullet points when listing.
      - Never invent prices, promise stock, or share personal data.
      - If the question is unrelated to shopping, politely redirect.
      - You have no memory between conversations.

# Spring Doc / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

# Logging is fully configured by src/main/resources/log4j2-spring.xml.
# Only levels are honoured from here (Spring Boot's LoggingSystem forwards them to Log4j2).
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
    com.shoplane.common.RequestIdFilter: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
